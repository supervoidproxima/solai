[agent]
job            = "The job"
returns        = "What it returns"
evals          = "Evals"
reads          = "Reads:"
refusals       = "Refuses:"
induces        = "This agent declares"
induces-note   = "Watch for it in your own output: the failure mode is the one the job invites."
kind           = "Return kind:"
keys           = "Keys:"
field          = "Field"
eval           = "Eval"
asserts        = "Asserts"
fails-when     = "Fails when"

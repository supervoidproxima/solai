# Interface strings for generated artefacts. One file per output language.
# Emitters never hardcode a heading: the language answer at setup has to be real,
# not cosmetic, or a Russian vault ends up with an English data dictionary.
language = "en"
language-name = "English"

[dd]
title            = "Card field reference"
generated-note   = "Generated from the class declarations. Edit the declaration, not this file."
s1              = "1. Status matrix"
s1-class        = "Class"
s1-values       = "Values (lifecycle order, terminal after the divider)"
s1-notes        = "Notes"
s2              = "2. Enumerated fields"
s2-field        = "Field"
s2-classes      = "Classes"
s2-values       = "Values"
s2-meaning      = "Meaning"
s3              = "3. Derived fields"
s3-computed     = "How it is computed"
s3-type         = "Type"
s4              = "4. Schemas by class"
s4-field        = "Field"
s4-type         = "Type"
s4-card         = "Card."
s4-req          = "Req."
s4-values       = "Values"
s4-meaning      = "Meaning"
s4-body         = "Body"
s4-required-h2  = "required"
s4-optional-h2  = "optional"
s4-terminal     = "A terminal card opens with a callout naming the reason and the date."
s5              = "5. Links between classes"
s5-bidirectional = "Reciprocal, validated"
s5-oneway        = "Typed one-way (reverse via backlinks)"
s5-lateral       = "Lateral, same class"
s5-lookup        = "Lookup"
s6               = "6. Known drift"
s6-hint          = "What the vault actually contains that this reference does not yet describe. Hand-written: it records reality against the declaration and so cannot be derived from it."
yes              = "yes"
no               = "no"
none             = "none"
unknown          = "Unknown"


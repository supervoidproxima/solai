schema    = 1
archetype = "role"
title     = "Role"
summary   = "A role you have taken up: what it owes, and what leaves because of it. Two classes on one line - duty, deliverable - and a folder for the documents that impose the first."

# Top-level keys must precede the first table header. In TOML a bare key after `[ids]`
# belongs to `ids`, and the failure is silent: the archetype loads with zero classes.
classes = ["duty", "deliverable"]

# `decision` is NOT here, and its declaration is still in `classes/`. It is offered by the
# interview and installable on request; it is not built by default. In the one real role
# vault it held zero cards after the whole archive had been read, while carrying a skill, a
# folder, a data-dictionary section and a row in CLAUDE.md - machinery counted on the
# document side of the ratio this package publishes about itself (D16). A class earns
# scaffolding by having work in it, and the second such vault can say whether this one was
# unusual.
lookups = []

# All four, plus the reader. A role is defined by documents it did not write and reads them
# cold (scout, extractor); a duty is a reading of a clause and someone senior may read
# it differently (refuter); and every deliverable is prose a person outside the place judges
# (editor).
#
# The reader is here because the documents that constitute a role arrive as Word, Excel,
# PowerPoint and PDF. The scout can find them and the extractor can turn a readable source
# into records, but neither can get the words out of a deck, and a role vault hits that on
# its first day.
agents = ["scout", "refuter", "extractor", "editor", "reader"]

# Two. The constitutive documents arrive as a batch to be read down into duties
# (intake), and everything that leaves is read by someone who did not write it (polish).
# Review wants a standing body of findings to attack; a role has deliverables instead.
workflows = ["intake", "polish"]

# Two classes and they sit on one line: what is owed -> what left against it. A promise made
# to a person is NOT a third class - it is a deliverable in `promised`, because a promise and
# the thing promised are one object at two moments, and splitting them makes two cards with
# nothing comparing them (D3). Anything that moves neither is a note in `sources/` or
# `people/`.
#
# `deliverables/` is what the role can SHOW. It is not the whole of what the role DOES: the
# first real vault of this archetype spent five days taking custody of an archive - naming,
# registering, deduplicating, generating - and produced almost nothing that left. Calling
# that folder "the only evidence the role produced anything" made all of it invisible, which
# was a defect in the sentence and not in the work.

[interview]
asks = ["mode", "root", "name", "remit", "output_language",
        "content_languages", "filename_language",
        "holder", "succession", "corpus",
        "governance_tier", "classes", "partition", "first_artefact"]

# `holder` and `succession` are asked before anything is built, because the answer to the
# second changes what the vault is for. A role taken over from someone else does not begin
# by reading its charter down into duties: it begins by finding out whether a charter
# exists at all. Most of what a successor inherits is a predecessor's practice, which is a
# weaker thing than a clause and has to be recorded as such from the first card, not
# retrofitted onto fifteen of them later.
#
# Not asking has a measured cost. In one vault the succession surfaced forty exchanges in,
# by accident, when the annual plan turned out to name a different person throughout. Every
# duty card had to be reopened to say whose practice it recorded.

[interview.holder]
prompt = "Who holds this role? The name seeds `people/`, and it is what separates your own work from your predecessor's in everything the vault reads later."

[interview.succession]
prompt  = "Are you the first holder of this role, or did you take it over from someone?"
values  = ["first", "successor", "unknown"]
default = "unknown"

[interview.corpus]
prompt = "Where do you already keep this work? A folder path, or blank. The vault starts empty and the work does not, and counting what already exists is the difference between a plan and a guess."

[interview.defaults]
# The opening line of the place, offered rather than imposed: the page fills it in
# and stops the moment anyone edits it. A blank first field is a stall, and a
# sentence nobody wrote is at least the sentence this type is for.
first_artefact  = "The list of what this role owes, handed to whoever appointed it."
remit           = "Everything this role owes, produces and decides, in one place."
governance_tier = "standard"
changes_folder  = "changes"

[interview.partition]
prompt  = "Optional. Short codes for your areas of responsibility - most people leave this blank until the duties show what the areas actually are."
example = ["METHOD", "SCHOOLS", "REPORTING"]
binds   = "area"

# The partition binds to `area`, not `stream` or `track`. A role is split by what it answers
# for, not by a value stream it happens to touch and not by parallel bets: areas are named in
# the document that appointed you, and borrowing either other word would import a vocabulary
# that says something the appointment does not.

[ids]
card          = "^[A-Z]{3}-[0-9]{3}$"
change        = "^CHG-[0-9]{3}$"
date          = "YYYY-MM-DD"
property-case = "kebab"
file-case     = "kebab"
block-id      = "^\\^[0-9a-f]{6}$"


# --------------------------------------------------------------------------- folders

[[folders]]
path = "charter"
purpose = "what constitutes the role: the job description, the order appointing you, the regulations that bind it. Read-only once onboarded"
[[folders]]
path = "plans"
purpose = "what the role is measured against this period. Superseded rather than edited, so last year's target stays readable"
[[folders]]
path = "duties"
purpose = "one card per thing the role owes, each traced to the document or the instruction that imposes it"
[[folders]]
path = "deliverables"
purpose = "one card per thing that leaves, promised or sent. What the role can show someone outside it"
[[folders]]
path = "sources"
purpose = "what arrived from outside and informs the work without constituting the role. Read-only once onboarded"
[[folders]]
path = "people"
purpose = "who the role deals with: one note each, what they hold and what they have asked for. Notes, not cards - a person is not a unit of work"
[[folders]]
path = "changes"
purpose = "change records, immutable once written"
[[folders]]
path = "_inbox"
purpose = "unprocessed capture. Cleared, not archived"
[[folders]]
path = "_system"
purpose = "vault infrastructure"
[[folders]]
path = "_system/scripts"
purpose = "generators and checks, with a run-order contract in the readme"
[[folders]]
path = "_system/handoff"
purpose = "session handoff notes, written at half context"
[[folders]]
path = "_system/runs"
purpose = "dated audit output. Ephemeral and regenerable"
[[folders]]
path = "_system/os"
purpose = "engine state. Out of scope of the vault's own governance"

# `charter/` rather than `mandate/`: the operator's own lexicon bans the word, and an English
# folder name would still pull the calque into the Russian prose written beside it.

# --------------------------------------------------------------------------- artefacts

[[artefacts]]
id      = "claude-md"
path    = "CLAUDE.md"
mode    = "merged"
emitter = "claudemd"
regions = ["header", "purpose", "language", "constraints", "id-standard", "card-index",
           "loop", "structure", "frontmatter", "naming", "citation", "handoff",
           "change-discipline", "honesty"]
generated = ["language", "id-standard", "card-index", "loop", "structure",
             "frontmatter", "naming", "citation"]

[[artefacts]]
id      = "data-dictionary"
path    = "_system/data-dictionary.md"
mode    = "merged"
emitter = "classes"
regions = ["status-matrix", "enums", "derived", "schemas", "link-rules"]
generated = ["status-matrix", "enums", "derived", "schemas", "link-rules"]

[[artefacts]]
id      = "vocabulary"
path    = "_system/vocabulary.md"
mode    = "merged"
emitter = "vocabulary"
regions = ["keys"]
generated = ["keys"]

[[artefacts]]
id      = "start-here"
path    = "START-HERE.md"
mode    = "generated"
emitter = "starthere"

[[artefacts]]
id      = "bond"
path    = "_system/os/vault.md"
mode    = "generated"
emitter = "bond"

[[artefacts]]
id       = "scripts-readme"
path     = "_system/scripts/readme.md"
mode     = "seeded"
fragment = "system/scripts-readme.md"

[[artefacts]]
id      = "state"
path    = "_system/state.md"
mode    = "seeded"
fragment = "system/state.md"

[[artefacts]]
id      = "registry-base"
path    = "registry.base"
mode    = "generated"
emitter = "bases"

[[artefacts]]
id      = "dashboard"
path    = "dashboard.html"
mode    = "generated"
emitter = "dashboard"

[[artefacts]]
id      = "card-skills"
path    = ".claude/skills/{skill}/SKILL.md"
mode    = "merged"
emitter = "cardskill"
foreach = "classes"
regions = ["frontmatter", "step-id", "step-fields", "step-body", "step-write"]
generated = ["frontmatter", "step-id", "step-fields", "step-body", "step-write"]

[[artefacts]]
id    = "shared"
path  = ".claude/skills/_shared/"
mode  = "copied"
from  = "shared/"
files = ["status-protocol.md", "card-concision.md", "block-id-protocol.md"]

[[artefacts]]
id    = "scripts"
path  = "_system/scripts/"
mode  = "copied"
from  = "runtime/"
files = ["check_links.py", "stamp_check.py", "validate_cards.py",
         "gen_dashboard.py", "check_agents.py", "check_binaries.py",
         "measure_cards.py",
         "check_sensitive.py"]

[[artefacts]]
id       = "chg-001"
path     = "changes/CHG-001.md"
mode     = "seeded"
fragment = "chg/chg-001.md"
bootstrap = true

[[artefacts]]
id      = "agents"
path    = ".claude/agents/{agent}.md"
mode    = "merged"
emitter = "agent"
foreach = "agents"
regions = ["frontmatter", "job", "returns", "evals"]
generated = ["frontmatter", "job", "returns", "evals"]

[[artefacts]]
id      = "workflows"
path    = ".claude/workflows/{workflow}.js"
mode    = "merged"
emitter = "workflow"
foreach = "workflows"
regions = ["meta", "script"]
generated = ["meta", "script"]

# --------------------------------------------------------------------------- loop

[[loop]]
n = 1
name = "read the constitutive documents down into duties, one card per clause that binds"
skill = "/duty"
out = "duties/"
[[loop]]
n = 2
name = "confirm the reading with whoever can say it is wrong"
skill = "/duty"
out = "duties/"
[[loop]]
n = 3
name = "promise one thing, to a named person, with a date"
skill = "/deliverable"
out = "deliverables/"
[[loop]]
n = 4
name = "send it. Nothing else on this list is evidence"
skill = "/deliverable"
out = "deliverables/"
[[loop]]
n = 5
name = "check links, statuses and stamps"
skill = "/solai check"
out = "_system/runs/"
[[loop]]
n = 6
name = "name every standing duty nothing left against this period. Silence is a state"
skill = "-"
out = "_system/runs/"
[[loop]]
n = 7
name = "record what changed and why"
skill = "/solai change"
out = "changes/"
